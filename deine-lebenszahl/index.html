<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow to Grow Lebenszahlen</title>

    <style>
        body {
            margin: 20px;
            font-family: system-ui, Arial;
            display: flex;
            justify-content: center;
            align-content: center;
            min-height: 100vh;
            background: #fff;
        }

        .container {
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #AC352C, #235463);
            width: 100%;
            padding: 0 20px;
            border-radius: 10px;
            box-shadow: 0 1px 10px rgba(165, 71, 71, 0.15);
            max-width: 600px;
        }

        .teaser {
            font-size: 17px;
            color: #fff;
            margin-bottom: 30px;
        }

        h1 {
            color: #fff;
        }

        label {
            display: block;
            color: #fff;
            font-weight: 900;
            font-size: 16px;
        }

        input,
        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            margin-bottom: 12px;
            box-sizing: border-box;
            border-radius: 6px;
        }

        button {
            background: #56a8bd;
            color: #fff;
            border: 0;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #888;
        }

        .result {
            color: #fff;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: #eee;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .row.life {
            background: #fff3cd;
            font-weight: bold;
        }

        .row.master {
            background: #dbeafe;
            font-weight: bold;
        }

        .description {
            padding: 12px;
            background: #fafafa;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .progress-container {
            background: #eee;
            height: 18px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #fda155;
        }

        .calc-text {
            color: #fff;
        }

        .footer {
            margin-top: 40px;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Flow-to-Grow Lebenszahl</h1>
        <p class="teaser">
            Gib beliebige Zahlenfolge oder deine Geburtsdatum ein.
        </p>

        <label>Input:</label>
        <input id="birthdate" placeholder="z.B. 01.12.1987 oder 326895345">
        <button onclick="berechne()">Berechnen</button>

        <div id="output"></div>
        <div id="container-results"></div>

        <script>
            const daten = {
                lebenszahlen: {
                    "1": { titel: "Kreativität & Zuversicht", text: "Du bist hier, um anzufangen..." },
                    "2": { titel: "Kooperation & Balance", text: "Du bist hier, um Verbindung zu meistern..." },
                    "3": { titel: "Ausdruck & Sensibilität", text: "Du bist hier, um deine Stimme zu leben..." },
                    "4": { titel: "Stabilität & Prozess", text: "Du bist hier, um Strukturen zu schaffen..." },
                    "5": { titel: "Freiheit & Entwicklung", text: "Du bist hier, um Freiheit zu lernen..." },
                    "6": { titel: "Fürsorge & Verantwortung", text: "Du bist hier, um Verantwortung zu leben..." },
                    "7": { titel: "Wahrheit & Vertrauen", text: "Du bist hier, um Wahrheit zu erkennen..." },
                    "8": { titel: "Macht & Fülle", text: "Du bist hier, um wirksam zu sein..." },
                    "9": { titel: "Weisheit & Mitgefühl", text: "Du bist hier, um loszulassen..." }
                },
                meisterzahlen: {
                    "11": { titel: "Intuitive Führung", text: "Hohe Sensibilität..." },
                    "22": { titel: "Meister-Baumeister", text: "Vision + Umsetzung..." },
                    "33": { titel: "Meister-Herz", text: "Heilung & Liebe..." }
                }
            };

            function quersumme(z) {
                return z.toString().split("").reduce((a, b) => a + Number(b), 0);
            }

            function sleep(ms) {
                return new Promise(r => setTimeout(r, ms));
            }

            async function berechne() {
                const out = document.getElementById("output");
                const results = document.getElementById("container-results");

                const input = document.getElementById("birthdate").value;

                // NEU: alle Nicht-Ziffern entfernen
                const digits = input.replace(/\D/g, "");

                if (!digits.length) {
                    out.innerHTML = "Bitte Zahlen eingeben";
                    return;
                }

                out.innerHTML = `
                    <div class="calc-text">Berechnung läuft...</div>
                    <div class="progress-container"><div id="bar" class="progress-bar"></div></div>
                `;

                const bar = document.getElementById("bar");
                for (let i = 0; i <= 100; i++) {
                    bar.style.width = i + "%";
                    await sleep(10);
                }

                out.innerHTML = "";
                results.innerHTML = "";

                let current = quersumme(digits);
                let steps = [];
                let master = null;

                while (current >= 10) {
                    if ([11, 22, 33].includes(current)) master = current;
                    steps.push(current);
                    current = quersumme(current);
                }

                const lebenszahl = current;

                results.innerHTML = "<label class='result'>Auswertung:</label>";

                results.innerHTML += `
                    <div class="row life"><span>Lebenszahl</span><span>${lebenszahl}</span></div>
                `;

                if (master) {
                    results.innerHTML += `
                        <div class="row master"><span>Meisterzahl</span><span>${master}</span></div>
                    `;
                }

                steps.reverse().forEach(f => {
                    if (f !== master) {
                        results.innerHTML += `
                            <div class="row"><span>Zwischenwert</span><span>${f}</span></div>
                        `;
                    }
                });

                const l = daten.lebenszahlen[lebenszahl];
                if (l) {
                    results.innerHTML += `
                        <div class="description">
                            <h3>${l.titel}</h3>
                            <p>${l.text}</p>
                        </div>
                    `;
                }

                if (master && daten.meisterzahlen[master]) {
                    const m = daten.meisterzahlen[master];
                    results.innerHTML += `
                        <div class="description">
                            <h3>${m.titel}</h3>
                            <p>${m.text}</p>
                        </div>
                    `;
                }

                results.innerHTML += `
                    <div class="footer">
                        <h2>Newsletter</h2>
                        <input placeholder="E-Mail">
                        <button>Anmelden</button>
                    </div>
                `;
            }
        </script>

    </div>
</body>

</html>
```
